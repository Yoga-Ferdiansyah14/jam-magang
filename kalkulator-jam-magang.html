<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Jam Magang</title>
<style>
  :root{
    --bg: #0f1512;
    --panel: #161d19;
    --line: #26312b;
    --text: #e8ede9;
    --muted: #8a9891;
    --accent: #ffb454;
    --good: #6fcf97;
    --bad: #ef6f6f;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,180,84,0.08), transparent),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:32px 16px 64px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 8px;
  }
  h1{
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:-0.01em;
    font-weight:650;
  }
  .sub{color:var(--muted); font-size:14px; margin:0; line-height:1.5;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }
  .panel h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin:0 0 14px;
    font-weight:600;
  }

  .day-target{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .day-target button{
    flex:1;
    padding:10px 8px;
    border-radius:8px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    font-family:var(--mono);
    font-size:12.5px;
    cursor:pointer;
    transition:.15s;
  }
  .day-target button.active{
    border-color:var(--accent);
    color:var(--accent);
    background:rgba(255,180,84,0.08);
  }

  .session{
    display:grid;
    grid-template-columns:1fr auto 1fr auto;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .session input[type="time"]{
    width:100%;
    background:#0d1310;
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:9px 8px;
    font-family:var(--mono);
    font-size:14px;
  }
  .session .arrow{color:var(--muted); font-size:13px;}
  .session .remove{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:16px;
    padding:4px 8px;
    line-height:1;
  }
  .session .remove:hover{color:var(--bad);}

  .row-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
  }
  #addSession{
    background:none;
    border:1px dashed var(--line);
    color:var(--muted);
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
    font-family:var(--sans);
  }
  #addSession:hover{border-color:var(--accent); color:var(--accent);}

  .extra{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .extra label{font-size:13px; color:var(--muted); flex-shrink:0;}
  .extra input{
    width:90px;
    background:#0d1310;
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-family:var(--mono);
    font-size:14px;
  }

  .result{
    text-align:center;
    padding:26px 20px;
  }
  .result .total-min{
    font-family:var(--mono);
    font-size:44px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--text);
  }
  .result .total-label{
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.1em;
    margin-top:2px;
  }
  .result .total-hm{
    font-family:var(--mono);
    font-size:15px;
    color:var(--muted);
    margin-top:8px;
  }
  .status{
    margin-top:16px;
    padding:10px 14px;
    border-radius:8px;
    font-family:var(--mono);
    font-size:13.5px;
    display:inline-block;
  }
  .status.good{background:rgba(111,207,151,0.1); color:var(--good); border:1px solid rgba(111,207,151,0.3);}
  .status.bad{background:rgba(239,111,111,0.1); color:var(--bad); border:1px solid rgba(239,111,111,0.3);}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:11.5px;
    margin-top:24px;
    font-family:var(--mono);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Logbook Utility</p>
    <h1>Kalkulator Jam Magang</h1>
    <p class="sub">Masukkan jam mulai &amp; selesai tiap sesi kerja hari ini. Total menit dihitung otomatis dan dibandingkan dengan target harianmu.</p>
  </header>

  <div class="panel">
    <h2>Target Hari Ini</h2>
    <div class="day-target">
      <button type="button" data-target="540" class="active">Senin–Jumat · 540 mnt</button>
      <button type="button" data-target="540">Sabtu · 540 mnt</button>
      <button type="button" data-target="0" id="customBtn">Custom</button>
    </div>
    <div id="customWrap" style="display:none; margin-bottom:2px;">
      <input type="number" id="customTarget" placeholder="Target menit custom" style="width:100%; background:#0d1310; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 10px; font-family:var(--mono); font-size:14px;">
    </div>
  </div>

  <div class="panel">
    <h2>Sesi Kerja</h2>
    <div id="sessions"></div>
    <div class="row-actions">
      <button id="addSession" type="button">+ Tambah sesi</button>
    </div>
    <div class="extra">
      <label for="extraMin">Tambahan manual (menit)</label>
      <input type="number" id="extraMin" value="0" min="0">
    </div>
  </div>

  <div class="panel result">
    <div class="total-min" id="totalMin">0</div>
    <div class="total-label">Total Menit</div>
    <div class="total-hm" id="totalHM">0 jam 0 menit</div>
    <div id="statusBox"></div>
  </div>

  <footer>dibuat untuk mempermudah pengisian logbook harian</footer>
</div>

<script>
  const sessionsEl = document.getElementById('sessions');
  const addBtn = document.getElementById('addSession');
  const extraInput = document.getElementById('extraMin');
  const totalMinEl = document.getElementById('totalMin');
  const totalHMEl = document.getElementById('totalHM');
  const statusBox = document.getElementById('statusBox');
  const dayButtons = document.querySelectorAll('.day-target button:not(#customBtn)');
  const customBtn = document.getElementById('customBtn');
  const customWrap = document.getElementById('customWrap');
  const customTarget = document.getElementById('customTarget');

  let target = 540;

  function makeSession(start = '', end = '') {
    const row = document.createElement('div');
    row.className = 'session';
    row.innerHTML = `
      <input type="time" class="start" value="${start}">
      <span class="arrow">&rarr;</span>
      <input type="time" class="end" value="${end}">
      <button type="button" class="remove" title="Hapus sesi">&times;</button>
    `;
    row.querySelectorAll('input').forEach(i => i.addEventListener('input', calculate));
    row.querySelector('.remove').addEventListener('click', () => {
      row.remove();
      calculate();
    });
    sessionsEl.appendChild(row);
  }

  addBtn.addEventListener('click', () => makeSession());

  dayButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.day-target button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      customWrap.style.display = 'none';
      target = parseInt(btn.dataset.target, 10);
      calculate();
    });
  });

  customBtn.addEventListener('click', () => {
    document.querySelectorAll('.day-target button').forEach(b => b.classList.remove('active'));
    customBtn.classList.add('active');
    customWrap.style.display = 'block';
    customTarget.focus();
    target = parseInt(customTarget.value, 10) || 0;
    calculate();
  });

  customTarget.addEventListener('input', () => {
    target = parseInt(customTarget.value, 10) || 0;
    calculate();
  });

  extraInput.addEventListener('input', calculate);

  function timeToMin(t) {
    if (!t) return null;
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  }

  function calculate() {
    let total = 0;
    document.querySelectorAll('.session').forEach(row => {
      const s = timeToMin(row.querySelector('.start').value);
      const e = timeToMin(row.querySelector('.end').value);
      if (s !== null && e !== null && e > s) {
        total += (e - s);
      }
    });
    const extra = parseInt(extraInput.value, 10) || 0;
    total += extra;

    totalMinEl.textContent = total;
    const h = Math.floor(total / 60);
    const m = total % 60;
    totalHMEl.textContent = `${h} jam ${m} menit`;

    if (target > 0) {
      const diff = total - target;
      if (diff >= 0) {
        statusBox.innerHTML = `<span class="status good">✓ Sudah memenuhi target (+${diff} menit)</span>`;
      } else {
        statusBox.innerHTML = `<span class="status bad">Kurang ${Math.abs(diff)} menit dari target ${target}</span>`;
      }
    } else {
      statusBox.innerHTML = '';
    }
  }

  // initial state
  makeSession();
  makeSession();
  calculate();
</script>
</body>
</html>
